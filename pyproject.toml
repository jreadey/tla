[project]
name = "tla"
version = "0.1.0"
description = "Turn-based navy strategy game on a hex grid"
requires-python = ">=3.12"
dependencies = [
    "arcade>=3.3,<4",
    "noise>=1.2,<2",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]
# Only needed for tla.ai.belief_store.BeliefStore -- optional HDF5 dump of
# EnemyModel position-belief fields for offline inspection. Nothing else in
# the game imports h5py, so a normal install/play doesn't need it.
hdf5 = [
    "h5py>=3.10,<4",
]

[tool.setuptools.packages.find]
include = ["tla*"]

[tool.pytest.ini_options]
# A handful of tests (@pytest.mark.slow) dominate the suite's wall-clock
# time: the two full self-play games in test_ai_selfplay.py (real AI-vs-AI
# games out to thousands of turns each) and two large-map generation
# sweeps in test_mapgen.py (several seeds at map sizes big enough to need
# a raised max_generation_attempts) -- together ~15-20 min, vs. seconds
# for the other 600+ tests. Run `pytest` day to day for fast feedback on
# every change, and `pytest -m slow` (or `pytest -m ""` for literally
# everything) before considering a change to AI behavior or map
# generation actually done -- same rigor this project has always required
# for those, just no longer paid on every unrelated edit too.
addopts = "-m 'not slow'"
markers = [
    "slow: full self-play games / large map-generation sweeps -- run explicitly (`pytest -m slow`), not on every edit",
]
